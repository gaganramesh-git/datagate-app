name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev,service]"
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Tests
        run: uv run pytest -q
      - name: Eval harness (detection, calibration, fit, false positives)
        run: uv run python evals/harness.py --json eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.python-version }}
          path: eval-results.json
          if-no-files-found: ignore
